name: GMCP Key Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-gmcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the GMCP validator
        run: python3 tests/ci/gmcp/test_validate.py -v

      - name: Validate GMCP keys and widget API references
        run: python3 scripts/ci/gmcp/validate.py src
