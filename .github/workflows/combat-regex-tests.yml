name: Draft Combat and Log Regex Fixtures

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  combat-regex-tests:
    name: Draft regex fixtures (Python re)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check captures and rejections on synthetic lines
        run: python3 tests/test_combat_regex_fixtures.py -v

      - name: Build a preview ZIP and verify its layout and contents
        run: python3 tests/test_build_preview_zip.py -v

      - name: Extract command metadata from synthetic help pages
        run: python3 tests/test_extract_help.py -v

      - name: Generate pending acceptance specs from a synthetic board
        run: python3 tests/test_pending_specs.py -v

      - name: Package and install the DEV harness plugin into a temporary folder
        run: python3 tests/test_install_dev_plugin.py -v
