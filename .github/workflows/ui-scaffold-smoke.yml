name: UI Scaffold Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Lua specs and widget smoke (Lua ${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.1.5', '5.4.8']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Lua ${{ matrix.lua }}
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}

      - name: Run every tests/**/*_spec.lua
        run: lua tests/run.lua

      - name: Exercise the embedded widget scripts
        run: |
          node tests/comms_hub_widget.js
          node tests/scrapper_cockpit_widget.js
          node tests/target_cockpit_widget.js
