name: LOTJ Plugin Lua Syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lua-syntax:
    name: Lua ${{ matrix.lua }} source syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.1.5', '5.4.8']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Lua ${{ matrix.lua }}
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}

      - name: Parse all tracked Lua sources under src
        shell: bash
        run: git ls-files -z -- 'src/*.lua' | xargs -0 -n 1 luac -p
